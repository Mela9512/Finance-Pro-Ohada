name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Backend unit tests
        run: npm run test:backend

  e2e:
    runs-on: ubuntu-latest
    needs: lint-build-test
    # Les tests e2e frappent une vraie base Postgres : ils ne s'exécutent que si le secret
    # DATABASE_URL est configuré dans les paramètres du dépôt (Settings > Secrets and variables > Actions).
    if: ${{ vars.E2E_ENABLED == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: 'true'
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: '8h'
      CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
      FRONTEND_URL: 'http://localhost:3000'
      PORT: '3001'
      NODE_ENV: 'test'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm --prefix packages/shared run build

      - name: Backend e2e tests
        run: npm run test:e2e
